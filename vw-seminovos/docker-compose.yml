services:
  db:
    image: mysql:8.4
    container_name: vw-db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: vw_seminovos
      MYSQL_USER: vw_user
      MYSQL_PASSWORD: vw_pass
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./db/02_v2.sql:/docker-entrypoint-initdb.d/02_v2.sql:ro
      - ./db/03_monitoring.sql:/docker-entrypoint-initdb.d/03_monitoring.sql:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysql -uvw_user -pvw_pass -e 'SELECT 1 FROM vw_seminovos.cars LIMIT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build: ./backend
    container_name: vw-backend
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: vw_user
      DB_PASSWORD: vw_pass
      DB_NAME: vw_seminovos
      # OpenTelemetry: traces enviados ao Alloy, que repassa ao Grafana Cloud Tempo
      OTEL_SERVICE_NAME: vw-backend
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=vw-seminovos,service.version=2.0.0,deployment.environment.name=lab
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_SAMPLER: parentbased_always_on
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: vw-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

  # Grafana Alloy: coleta métricas, logs e traces e envia ao Grafana Cloud.
  # Credenciais em .env (modelo em .env.example). UI: http://localhost:12345
  alloy:
    image: grafana/alloy:v1.19.2
    container_name: vw-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    env_file: .env
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      # logs dos containers e descoberta de serviços
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # cAdvisor (métricas de CPU, memória, rede e disco dos containers)
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /run/containerd:/run/containerd:ro   # Docker Desktop com containerd image store
    privileged: true
    ports:
      - "12345:12345"
    restart: unless-stopped

volumes:
  db_data:
  alloy_data:
