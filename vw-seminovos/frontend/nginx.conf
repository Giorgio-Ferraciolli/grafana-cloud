# Log de acesso em JSON: o Alloy lê pelo Docker e o Loki permite filtrar por status, tempo etc.
log_format json_access escape=json
  '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
  '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
  '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
  '"referer":"$http_referer","user_agent":"$http_user_agent","traceparent":"$http_traceparent"}';

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log json_access;

    # DNS interno do Docker: resolve o "alloy" sob demanda, então o site sobe mesmo sem o Alloy
    resolver 127.0.0.11 valid=30s ipv6=off;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Telemetria do navegador (Grafana Faro) -> receptor faro.receiver do Alloy
    location = /collect {
        access_log off;
        client_max_body_size 5m;
        set $faro_receiver http://alloy:12347;
        proxy_pass $faro_receiver;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # HTML, CSS e JS sempre revalidados: evita o navegador usar versão antiga depois de um rebuild
    location ~* \.(?:html|css|js)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
