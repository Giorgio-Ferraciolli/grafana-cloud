server.port=5050
spring.main.banner-mode=off

# PostgreSQL (../postgres-lab), o mesmo banco da flask-lab-api. Valores vêm do compose.
# ApplicationName aparece no pg_stat_activity e nos logs do Postgres (app=java-lab-api).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lab}?ApplicationName=java-lab-api&connectTimeout=2
spring.datasource.username=${DB_USER:lab_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.pool-name=java-lab-api
spring.datasource.hikari.maximum-pool-size=10
# Falha rápido (o healthcheck tem 3s): sem conexão em 2s, /health responde 503
spring.datasource.hikari.connection-timeout=2000
# O schema é do ../postgres-lab (initdb), a API não cria tabelas
spring.sql.init.mode=never

# Sem o /** estático padrão: o frontend é servido por FrontendController + WebConfig,
# e rota inexistente continua virando 404 JSON
spring.web.resources.add-mappings=false
# Nunca página de erro HTML
server.error.whitelabel.enabled=false

# Mesma ordem de chaves do jsonify do Flask (ordenadas)
spring.jackson.mapper.sort-properties-alphabetically=true
spring.jackson.serialization.order-map-entries-by-keys=true
