services:
  mysql:
    image: mysql:8.0
    container_name: planner-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-planner}
      MYSQL_USER: ${MYSQL_USER:-planner}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - planner-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./backend
    container_name: planner-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      DATABASE_URL: mysql://${MYSQL_USER:-planner}:${MYSQL_PASSWORD:-change-me}@mysql:3306/${MYSQL_DATABASE:-planner}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-planner-backend}
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-1.0.0}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=local}
      AGENTO11Y_ENDPOINT: ${AGENTO11Y_ENDPOINT:-}
      AGENTO11Y_PROTOCOL: ${AGENTO11Y_PROTOCOL:-http}
      AGENTO11Y_AUTH_MODE: ${AGENTO11Y_AUTH_MODE:-basic}
      AGENTO11Y_AUTH_TENANT_ID: ${AGENTO11Y_AUTH_TENANT_ID:-}
      AGENTO11Y_AUTH_TOKEN: ${AGENTO11Y_AUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "3001:3001"
    networks:
      - planner-net
    extra_hosts:
      # Lets the container reach an OTLP collector running on the host
      # machine (e.g. a locally installed Grafana Alloy) via
      # http://host.docker.internal:<port> if you choose that setup.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    container_name: planner-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - planner-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  planner-net:
    driver: bridge

volumes:
  mysql_data:
